name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8.15.0
        run_install: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install
    
    - name: Build project
      run: pnpm run build
    
    - name: List build output
      run: ls -la dist/
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # Backup old dist directory if it exists
          if [ -d "${{ secrets.DEPLOY_PATH }}/dist" ]; then
            mv ${{ secrets.DEPLOY_PATH }}/dist ${{ secrets.DEPLOY_PATH }}/dist.backup.$(date +%Y%m%d_%H%M%S)
          fi
          
          mkdir -p ${{ secrets.DEPLOY_PATH }}/dist
    
    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "dist/*"
        target: "${{ secrets.DEPLOY_PATH }}/dist/"
    
    - name: Set correct permissions
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # List files after copying
          echo "Files in deploy path:"
          ls -la ${{ secrets.DEPLOY_PATH }}/
          echo "Files in dist directory:"
          ls -la ${{ secrets.DEPLOY_PATH }}/dist/
          
          # Remove old backups, keeping the last 3
          cd ${{ secrets.DEPLOY_PATH }}
          ls -1t dist.backup.* 2>/dev/null | tail -n +4 | xargs -r rm -rf
          
          echo "Deployment completed successfully!"
