events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Upstream API server
    upstream api {
        server app:3000;
    }

    server {
        listen 80;
        server_name tarmaks.com www.tarmaks.com;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect HTTP to HTTPS (enable after SSL is set up)
        # return 301 https://$server_name$request_uri;

        # Serve static files
        root /var/www/html;
        index index.html;

        # API proxy
        location /api {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # HTTPS server (enable after SSL is set up)
    # server {
    #     listen 443 ssl http2;
    #     server_name tarmaks.com www.tarmaks.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/tarmaks.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/tarmaks.com/privkey.pem;
    #
    #     root /var/www/html;
    #     index index.html;
    #
    #     location /api {
    #         proxy_pass http://api;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
